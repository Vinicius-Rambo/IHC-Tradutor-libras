<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robô Byte Libras</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="inicio">
  <h1>Robô Byte Libras</h1>
  <p>Toque para ligar o microfone e começar a traduzir a fala em sinais.</p>
  <button id="comecar" type="button">Começar</button>
  <p id="aviso-inicio"></p>
</div>

<header>
  <span id="estado" class="chip">conectando…</span>
  <span id="nivel"><i id="nivel-barra"></i></span>
  <span class="espaco"></span>
  <label class="velocidade">Velocidade <input id="velocidade" type="range" min="0.5" max="1.5" step="0.1" value="1"></label>
  <button id="pausar" type="button" title="Pausar a escuta">Pausar</button>
  <button id="repetir" type="button" title="Repetir a última frase">Repetir</button>
  <button id="tela-cheia" type="button" title="Tela cheia">Tela cheia</button>
</header>

<main>
  <section id="palco">
    <canvas id="avatar"></canvas>
    <video id="video" playsinline muted hidden></video>
    <div id="midia" hidden></div>
    <div id="letras" aria-live="polite"></div>
    <div id="aguarde" hidden><span class="giro"></span> Gerando o avatar…</div>
    <p id="sem3d" hidden>Este navegador não abriu o avatar 3D. Os sinais aparecem como imagens, vídeos ou letras.</p>
  </section>

  <aside id="texto">
    <h2>Frase ouvida</h2>
    <p id="frase" class="vazio">Fale perto do tablet…</p>
    <h2>Em Libras (glosa)</h2>
    <p id="glosa" class="vazio">—</p>
    <p id="ouvido-novo" hidden></p>
    <form id="digitar" autocomplete="off">
      <input id="campo" type="text" maxlength="400" placeholder="Ou digite uma frase e toque em Traduzir">
      <button type="submit">Traduzir</button>
    </form>
    <h2>Anteriores</h2>
    <ul id="historico"></ul>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
